<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مزرعة العلوم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--bg:#1d2618;--card:#2a3624;--ink:#f3ead2;--mut:#b9ab8a;--line:#47563d;--soil:#6b4423;--soil2:#82552b;color-scheme:dark}

html{scroll-padding-top:env(safe-area-inset-top,0px)}

.top h1{margin:0;font-size:1.25rem;font-weight:900}

.tag{display:inline-block;background:var(--gold);color:#3b2a1a;border-radius:10px;padding:0 10px;font-size:.78rem;font-weight:700}
.muted{color:var(--mut);font-size:.85rem}

input{width:100%;font:700 1rem Cairo;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin-top:8px}
ul{padding-inline-start:20px;margin:6px 0}

.me{background:rgba(90,168,74,.2);border-radius:10px}

.dc{position:absolute;font-size:2.2rem;line-height:1;transform:translate(-50%,-50%);touch-action:none;user-select:none;padding:2px}
.ed .dc{pointer-events:auto;outline:2px dashed #fff;border-radius:10px;background:#ffffff40;cursor:grab}
</style>
</head>

 return `<button class="btn alt" data-back=1 style="margin-top:12px">↩️ العودة إلى السوق</button><div class=shopin><h2>${m[3]} ${m[1]}</h2>${h}</div>`}
function learnV(){const st=[['🌰','#5aa84a','١. اشترِ البذور','في السوق ادخل «متجر البذور». أجب عن ٥ أسئلة علوم، فإذا أصبت ٤ يفتح المحل أسبوعًا.'],['🌱','#7cc25a','٢. ازرع','في المزرعة اضغط على أرض فارغة واختر بذرة.'],['🌾','#e8a91c','٣. احصد','انتظر حتى تكبر النبتة ثم اضغط عليها لتحصدها.'],['🧺','#8b5a2b','٤. بِع المحصول','ادخل «سوق المحاصيل» واضغط «بيع الكل» لتأخذ العملات.'],['🏗️','#4a7fc0','٥. كبّر مزرعتك','افتح الأراضي المقفولة 🔒 بالعملات، وابنِ حظيرة للدجاج أو الأبقار ثم اشترِ حيواناتك. اجمع البيض واللبن ✨ وزيّن المزرعة: اضغط «رتّب الزينة» وحرّك كل زينة بإصبعك.'],['⭐','#d9534f','٦. النقاط والمستويات','كل إجابة صحيحة = ١٠ نقاط. كل ٥٠ نقطة تنقلك لمستوى جديد، ويزيد عدد مرات الشراء يوميًا: ٣ ثم ٥ ثم ٧.'],['📘','#8e5fc9','٧. الامتحان والتدريب','بعد الأسبوع يُقفل المحل، فأعد الامتحان لتفتحه. التدريب مرتان يوميًا ويعطيك نقاطًا. في مستوى الخبير يوجد امتحان التحدي (١٠ أسئلة).'],['🏆','#e8a91c','٨. الإنجازات','اجمع الميداليات 🥉🥈🥇 من البيع والحصاد والحيوانات والأراضي.']];
 return `<div class=card><span class=tag>ابدأ هنا</span><h2>مزرعة العلوم تنتظرك! 🧑‍🌾</h2><p>ورثت مزرعة صغيرة، ومفتاح المحلات هو معلوماتك في العلوم!</p></div>`+st.map(x=>`<div class="card st" style="--c:${x[1]}"><span class=ic>${x[0]}</span><div><h3>${x[2]}</h3><p>${x[3]}</p></div></div>`).join('')+`<div class=card><span class=tag>نصيحة</span><p>الأسئلة عن النبات والتربة والطاقة والمادة. ذاكر جيدًا وستفتح كل المحلات 🌻</p></div>`}
function badV(){return `<div class=card><h2>🎖️ الشارات</h2>${BG.map(b=>`<div class="badge ${S.badges.includes(b[0])?'':'off'}"><span>${b[1]}</span>${b[2]}</div>`).join('')}</div>`+AC.map(a=>{const v=a[4](),l=S.tr[a[0]]||0,nx=a[5][Math.min(l,2)];return `<div class=card><h2>${a[1]} ${a[2]}</h2><div>${['🥉','🥈','🥇'].map((x,i)=>`<span class="med${l>i?'':' off'}">${x}</span>`).join('')}</div><div class=bar><i style="width:${Math.min(100,v/nx*100)}%"></i></div><div class=muted>${Math.min(v,nx)}/${nx} ${a[3]}${l==3?' ✅ اكتمل':''}</div></div>`}).join('')}
view=()=>tab=='learn'?learnV():tab=='farm'?farmV():tab=='shop'?shopV():tab=='badges'?badV():_v();
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!S)return;const d=b.dataset;
 if(d.t)shopIn=null;
 else if(d.shop){shopIn=d.shop;render();scrollTo(0,0)}
 else if(d.back){shopIn=null;render()}
 else if(d.bpen){const k=d.bpen;if(S.pen[k]||S.coins<PEN[k])return;S.coins-=PEN[k];S.pen[k]=1;save();toast('🏗️ فتحت '+PEN_N[k]);render()}
 else if(d.sell){const k=d.sell,n=S.crops[k];S.st.earn+=n*price(k);S.st.sales+=n}
 else if(d.ba&&!S.pen[d.ba]){e.stopImmediatePropagation();toast('افتح الحظيرة أولًا 🏗️')}
},true);

/* ===== decor placement ===== */
let edit=false,drag=null;
const dpos=i=>[12+(i%4)*24,16+Math.floor(i/4)*10];
function dsync(){S.dp=S.dp||[];S.own.filter(x=>D[x]).forEach(k=>{if(!S.dp.some(d=>d.k==k)){const q=dpos(S.dp.length);S.dp.push({k,x:q[0],y:q[1]})}})}
const _fv=farmV;farmV=()=>{dsync();let h=_fv();
 const L=`<div class=dl>${S.dp.map((d,i)=>S.own.includes(d.k)?`<div class=dc data-di=${i} style="left:${d.x}%;top:${d.y}%">${D[d.k].e}</div>`:'').join('')}</div>`;
 h=h.replace(/<div class=deco>.*?<\/div>/s,'');
 return h.replace('<div class=world>',(S.own.some(x=>D[x])?`<button class="btn${edit?'':' alt'}" data-edit=1 style="margin-top:12px">${edit?'✔ تم الترتيب':'🎨 رتّب الزينة'}</button>${edit?'<p class=muted>اسحب أي زينة بإصبعك وضعها في المكان الذي تحبه.</p>':''}`:'')+`<div class="world${edit?' ed':''}">`+L)};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!S)return;if(b.dataset.edit){edit=!edit;render()}else if(b.dataset.t)edit=false},true);
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.dc');if(!edit||!c)return;drag=c;try{c.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!drag)return;const r=drag.closest('.world').getBoundingClientRect(),x=Math.max(4,Math.min(96,(e.clientX-r.left)/r.width*100)),y=Math.max(6,Math.min(96,(e.clientY-r.top)/r.height*100)),d=S.dp[+drag.dataset.di];drag.style.left=x+'%';drag.style.top=y+'%';d.x=+x.toFixed(1);d.y=+y.toFixed(1)});
document.addEventListener('pointerup',()=>{if(drag){drag=null;save()}});
fix();
render();
</script>
